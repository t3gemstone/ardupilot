version: '3'

vars:
  BUILD_DIR: "{{ .ROOT_DIR }}/build"
  DOWNLOAD_DIR: "{{ .BUILD_DIR }}/downloads"
  TOOLCHAINS_DIR: "{{ .BUILD_DIR }}/${DISTRO_BASE}-${DISTRO_SUITE}"
  VENV_DIR: "{{ .ROOT_DIR }}/.venv"
  WAF: "{{ .ROOT_DIR }}/modules/waf/waf-light"
  URLS:
    map: {
      toolchains: "https://github.com/t3gemstone/toolchains/releases/latest/download/t3gemstone-toolchains-${DISTRO_BASE}-${DISTRO_SUITE}.tar.gz",
    }

env:
  MACHINE: t3-gem-o1
  DISTRO_BASE: ubuntu
  DISTRO_SUITE: jammy
  VEHICLE: plane
  BOARD_USER: gemstone
  BOARD_IP: 192.168.7.2
  BOARD_DIR: /opt/ardupilot
  SITL_LOCATION: ARDUCOPTER_AUTOTEST
  SITL_VEHICLE: ArduPlane
  SITL_FRAME: gazebo-skywalker-x8-quad
  SITL_WORLD: skywalker_x8_quad_runway.sdf

tasks:

  default:
    silent: true
    cmds:
      - task --list-all --summary
      - echo
      - echo "Environment:"
      - echo "  MACHINE       = ${MACHINE}"
      - echo "  DISTRO_BASE   = ${DISTRO_BASE}"
      - echo "  DISTRO_SUITE  = ${DISTRO_SUITE}"
      - echo "  VEHICLE       = ${VEHICLE}"
      - echo "  BOARD_USER    = ${BOARD_USER}"
      - echo "  BOARD_IP      = ${BOARD_IP}"
      - echo "  BOARD_DIR     = ${BOARD_DIR}"
      - echo "  SITL_LOCATION = ${SITL_LOCATION}"
      - echo "  SITL_VEHICLE  = ${SITL_VEHICLE}"
      - echo "  SITL_FRAME    = ${SITL_FRAME}"
      - echo "  SITL_WORLD    = ${SITL_WORLD}"
      - echo

  wget:
    internal: true
    silent: true
    cmds:
      - mkdir -p $(dirname "{{ .PATH }}")
      - wget --no-clobber --continue --quiet --show-progress -O "{{ .PATH }}" "{{ .URL }}" || true
    requires:
      vars: [ URL, PATH ]
    status:
      - test -f "{{ .PATH }}"

  fetch:
    silent: true
    cmds:
      - task: wget
        vars:
          URL: '{{ get .URLS "toolchains" }}'
          PATH: "{{ .DOWNLOAD_DIR }}/t3gemstone-toolchains-${DISTRO_BASE}-${DISTRO_SUITE}.tar.gz"
      - |
        if [ ! -d "{{ .TOOLCHAINS_DIR }}" ]; then
          mkdir -p "{{ .TOOLCHAINS_DIR }}"
          tar xf "{{ .DOWNLOAD_DIR }}/t3gemstone-toolchains-${DISTRO_BASE}-${DISTRO_SUITE}.tar.gz" --directory "{{ .TOOLCHAINS_DIR }}"
        fi
      - |
        python3 -m venv "{{ .VENV_DIR }}"
        export PATH="{{ .VENV_DIR }}/bin:$PATH"
        pip3 install --disable-pip-version-check \
          dronecan==1.0.26 \
          empy==3.3.4 \
          future==1.0.0 \
          pexpect==4.9.0 \
          setuptools==80.9.0

  destroy:
    prompt: 'T3 Gemstone Toolchains will be deleted. Do you want to continue?'
    cmds:
      - rm -f "{{ .DOWNLOAD_DIR }}/t3gemstone-toolchains-${DISTRO_BASE}-${DISTRO_SUITE}.tar.gz"
      - rm -rf "{{ .TOOLCHAINS_DIR }}"

  build:
    cmds:
      - task: fetch
      - |
        pushd "{{ .TOOLCHAINS_DIR }}" >/dev/null && source ./env && popd >/dev/null
        export PATH="{{ .VENV_DIR }}/bin:$PATH"
        {{ .WAF }} configure --board="${MACHINE}"
        {{ .WAF }} "${VEHICLE}"
        aarch64-linux-gnu-strip "{{ .BUILD_DIR }}/{{ .MACHINE }}/bin/ardu${VEHICLE}"

  board-setup:
    desc: 'Prepare T3 Gemstone board for running ArduPilot'
    silent: true
    cmds:
      - |
        echo -n "${BOARD_USER}@${BOARD_IP}'s password: "
        read -s BOARD_PASS
        echo
        export SSHPASS="${BOARD_PASS}"

        rsync -av --mkpath --checksum -e "sshpass -e ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" \
          "build/${MACHINE}/bin" gemstone/* "$BOARD_USER@$BOARD_IP:/tmp/ardupilot"

        sshpass -e ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" "${BOARD_USER}@${BOARD_IP}" "
          echo ${BOARD_PASS} | sudo -S -p '' install -d ${BOARD_DIR}/bin ${BOARD_DIR}/etc ${BOARD_DIR}/var
          echo ${BOARD_PASS} | sudo -S -p '' cp -r /tmp/ardupilot/etc /tmp/ardupilot/bin ${BOARD_DIR}
          echo ${BOARD_PASS} | sudo -S -p '' cp /tmp/ardupilot/systemd/* /etc/systemd/system
          echo ${BOARD_PASS} | sudo -S -p '' systemctl daemon-reload
          echo ${BOARD_PASS} | sudo -S -p '' systemctl enable ardu${VEHICLE}
          echo ${BOARD_PASS} | sudo -S -p '' sed -i 's/^overlays=.*$/overlays=k3-am67a-t3-gem-o1-spidev0-1cs.dtbo k3-am67a-t3-gem-o1-i2c1-400000.dtbo k3-am67a-t3-gem-o1-uart-ttys0.dtbo k3-am67a-t3-gem-o1-uart-ttys6.dtbo k3-am67a-t3-gem-o1-pwm-ecap0-gpio12.dtbo k3-am67a-t3-gem-o1-pwm-ecap1-gpio16.dtbo k3-am67a-t3-gem-o1-pwm-ecap2-gpio18.dtbo k3-am67a-t3-gem-o1-pwm-epwm0-gpio5-gpio14.dtbo k3-am67a-t3-gem-o1-pwm-epwm1-gpio6-gpio13.dtbo/' /boot/uEnv.txt
          sync
        "
        echo
        echo "You must reboot your T3 Gemstone board now!"
    preconditions:
      - sh: test -f "build/${MACHINE}/bin/ardu${VEHICLE}"
        msg: "You must build ArduPilot for your vehicle first: task build"
      - sh: command -v sshpass
        msg: "You must install sshpass"
      - sh: command -v rsync
        msg: "You must install rsync"

  board-upload:
    desc: 'Upload new firmware to T3 Gemstone board'
    silent: true
    cmds:
      - |
        echo -n "${BOARD_USER}@${BOARD_IP}'s password: "
        read -s BOARD_PASS
        echo
        export SSHPASS="${BOARD_PASS}"

        rsync -av --mkpath --checksum -e "sshpass -e ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" \
          "build/${MACHINE}/bin" "$BOARD_USER@$BOARD_IP:/tmp/ardupilot"

        sshpass -e ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" "${BOARD_USER}@${BOARD_IP}" "
          echo ${BOARD_PASS} | sudo -S -p '' systemctl stop ardu${VEHICLE}
          echo ${BOARD_PASS} | sudo -S -p '' cp -r /tmp/ardupilot/bin ${BOARD_DIR}
          echo ${BOARD_PASS} | sudo -S -p '' systemctl start ardu${VEHICLE}
        "
    preconditions:
      - sh: test -f "build/${MACHINE}/bin/ardu${VEHICLE}"
        msg: "You must build ArduPilot for your vehicle first: task build"
      - sh: command -v sshpass
        msg: "You must install sshpass"
      - sh: command -v rsync
        msg: "You must install rsync"

  sitl-start:
    cmds:
      - xhost +local:docker
      - docker compose up --detach

  sitl-stop:
    cmds:
      - docker compose kill
      - docker compose down --remove-orphans
      - xhost -local:docker

  clean:
    cmds:
      - task: fetch
      - |
        pushd "{{ .TOOLCHAINS_DIR }}" >/dev/null && source ./env && popd >/dev/null
        export PATH="{{ .VENV_DIR }}/bin:$PATH"
        {{ .WAF }} clean

  install-ai-swarm:
    desc: 'Install AI Swarm dependencies, local LLM (Ollama), and configure MQTT'
    cmds:
      - |
        echo "[*] Installing System Dependencies (Mosquitto, Python3-pip)..."
        sudo apt-get update && sudo apt-get install -y mosquitto mosquitto-clients python3-pip
      - |
        if ! command -v ollama &> /dev/null; then
          echo "[*] Installing Ollama..."
          curl -fsSL https://ollama.com/install.sh | sh
        else
          echo "[+] Ollama is already installed."
        fi
      - |
        echo "[*] Pulling LLM Models (Phi-3-Mini for Leader, Qwen2-0.5B for Followers)..."
        ollama pull phi3:mini
        ollama pull qwen2:0.5b
      - |
        echo "[*] Installing Python Dependencies..."
        pip3 install -r gemstone/ai_swarm/requirements.txt
      - |
        echo "[+] AI Swarm Installation Complete!"
        echo "    Leader:   task swarm-leader DRONE_ID=1"
        echo "    Follower: task swarm-follower DRONE_ID=2 BROKER_IP=<leader-ip>"
        echo "    SITL:     task swarm-sitl-test"

  swarm-leader:
    desc: 'Start AI Swarm Leader on this drone (default ID=1)'
    vars:
      DRONE_ID: '{{ default "1" .DRONE_ID }}'
      BROKER_IP: '{{ default "localhost" .BROKER_IP }}'
      MAVLINK_URL: '{{ default "udpin:0.0.0.0:14550" .MAVLINK_URL }}'
    cmds:
      - |
        mosquitto -d 2>/dev/null || true
        python3 gemstone/ai_swarm/controller.py \
          --id {{ .DRONE_ID }} \
          --mode leader \
          --broker {{ .BROKER_IP }} \
          --mavlink {{ .MAVLINK_URL }}

  swarm-follower:
    desc: 'Start AI Swarm Follower (DRONE_ID=2 BROKER_IP=<leader-ip>)'
    vars:
      DRONE_ID: '{{ default "2" .DRONE_ID }}'
      BROKER_IP: '{{ default "localhost" .BROKER_IP }}'
      MAVLINK_URL: '{{ default "udpin:0.0.0.0:14550" .MAVLINK_URL }}'
    cmds:
      - |
        python3 gemstone/ai_swarm/controller.py \
          --id {{ .DRONE_ID }} \
          --mode follower \
          --broker {{ .BROKER_IP }} \
          --mavlink {{ .MAVLINK_URL }}

  swarm-sitl-test:
    desc: 'Launch N SITL drones + swarm controllers for local testing (NUM=3)'
    vars:
      NUM: '{{ default "3" .NUM }}'
    cmds:
      - |
        echo "[*] Starting SITL swarm test with {{ .NUM }} drones..."
        python3 gemstone/ai_swarm/sitl_test.py --num {{ .NUM }}

  install-vins-fusion:
    desc: 'Install VINS-Fusion (Visual-Inertial Odometry) with ROS Noetic + Ceres'
    cmds:
      - |
        echo "[*] Installing ROS Noetic (if not present)..."
        if ! command -v roscore &> /dev/null; then
          sudo sh -c 'echo "deb http://packages.ros.org/ros/ubuntu $(lsb_release -sc) main" \
            > /etc/apt/sources.list.d/ros-latest.list'
          curl -s https://raw.githubusercontent.com/ros/rosdistro/master/ros.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y ros-noetic-desktop
          echo "source /opt/ros/noetic/setup.bash" >> ~/.bashrc
        else
          echo "[+] ROS already installed."
        fi
      - |
        echo "[*] Installing VINS-Fusion dependencies..."
        sudo apt-get install -y \
          ros-noetic-cv-bridge \
          ros-noetic-tf \
          ros-noetic-message-filters \
          ros-noetic-image-transport \
          libgoogle-glog-dev \
          libatlas-base-dev \
          libsuitesparse-dev \
          libeigen3-dev
      - |
        echo "[*] Installing Ceres Solver..."
        if ! pkg-config --exists ceres 2>/dev/null; then
          cd /tmp
          wget -q https://github.com/ceres-solver/ceres-solver/archive/refs/tags/2.1.0.tar.gz
          tar xf 2.1.0.tar.gz
          mkdir -p ceres-solver-2.1.0/build && cd ceres-solver-2.1.0/build
          cmake .. -DBUILD_TESTING=OFF -DBUILD_EXAMPLES=OFF
          make -j$(nproc) && sudo make install
          echo "[+] Ceres Solver installed."
        else
          echo "[+] Ceres Solver already installed."
        fi
      - |
        echo "[*] Setting up catkin workspace with VINS-Fusion..."
        mkdir -p ~/catkin_ws/src
        source /opt/ros/noetic/setup.bash
        if [ ! -L ~/catkin_ws/src/VINS-Fusion ]; then
          ln -s "$(pwd)/VINS-Fusion" ~/catkin_ws/src/VINS-Fusion
          echo "[+] Symlinked VINS-Fusion into catkin workspace."
        fi
        cd ~/catkin_ws
        catkin_make -DCMAKE_BUILD_TYPE=Release -j$(nproc)
        echo "source ~/catkin_ws/devel/setup.bash" >> ~/.bashrc
      - |
        echo "[+] VINS-Fusion build complete!"
        echo "    Run: roslaunch vins vins_rviz.launch"
        echo "    Then: rosrun vins vins_node <config_file.yaml>"

  vins-start:
    desc: 'Start VINS-Fusion VIO and bridge pose to ArduPilot via MAVLink (EKF3 Vision)'
    vars:
      VINS_CONFIG: '{{ default "VINS-Fusion/config/t3_gem_o1/t3_gem_o1_stereo_imu_config.yaml" .VINS_CONFIG }}'
      ARDUPILOT_IP: '{{ default "192.168.7.2" .ARDUPILOT_IP }}'
    cmds:
      - |
        source /opt/ros/noetic/setup.bash
        source ~/catkin_ws/devel/setup.bash
        echo "[*] Starting VINS-Fusion node..."
        rosrun vins vins_node {{ .VINS_CONFIG }} &
        echo "[*] Starting VINS→MAVLink bridge (vision_position_estimate)..."
        python3 gemstone/ai_swarm/vins_mavlink_bridge.py --ardupilot {{ .ARDUPILOT_IP }}

