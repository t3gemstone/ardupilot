version: '3'

vars:
  BUILD_DIR: "{{ .ROOT_DIR }}/build"
  DOWNLOAD_DIR: "{{ .BUILD_DIR }}/downloads"
  TOOLCHAINS_DIR: "{{ .BUILD_DIR }}/${DISTRO_BASE}-${DISTRO_SUITE}"
  VENV_DIR: "{{ .ROOT_DIR }}/.venv"
  WAF: "{{ .ROOT_DIR }}/modules/waf/waf-light"
  URLS:
    map: {
      toolchains: "https://github.com/t3gemstone/toolchains/releases/latest/download/t3gemstone-toolchains-${DISTRO_BASE}-${DISTRO_SUITE}.tar.gz",
    }

env:
  MACHINE: t3-gem-o1
  DISTRO_BASE: ubuntu
  DISTRO_SUITE: jammy
  VEHICLE: plane
  BOARD_USER: gemstone
  BOARD_IP: 192.168.7.2
  BOARD_DIR: /opt/ardupilot
  SITL_LOCATION: ARDUCOPTER_AUTOTEST
  SITL_VEHICLE: ArduPlane
  SITL_FRAME: gazebo-skywalker-x8-quad
  SITL_WORLD: skywalker_x8_quad_runway.sdf

tasks:

  default:
    silent: true
    cmds:
      - task --list-all --summary
      - echo
      - echo "Environment:"
      - echo "  MACHINE       = ${MACHINE}"
      - echo "  DISTRO_BASE   = ${DISTRO_BASE}"
      - echo "  DISTRO_SUITE  = ${DISTRO_SUITE}"
      - echo "  VEHICLE       = ${VEHICLE}"
      - echo "  BOARD_USER    = ${BOARD_USER}"
      - echo "  BOARD_IP      = ${BOARD_IP}"
      - echo "  BOARD_DIR     = ${BOARD_DIR}"
      - echo "  SITL_LOCATION = ${SITL_LOCATION}"
      - echo "  SITL_VEHICLE  = ${SITL_VEHICLE}"
      - echo "  SITL_FRAME    = ${SITL_FRAME}"
      - echo "  SITL_WORLD    = ${SITL_WORLD}"
      - echo

  wget:
    internal: true
    silent: true
    cmds:
      - mkdir -p $(dirname "{{ .PATH }}")
      - wget --no-clobber --continue --quiet --show-progress -O "{{ .PATH }}" "{{ .URL }}" || true
    requires:
      vars: [ URL, PATH ]
    status:
      - test -f "{{ .PATH }}"

  fetch:
    silent: true
    cmds:
      - task: wget
        vars:
          URL: '{{ get .URLS "toolchains" }}'
          PATH: "{{ .DOWNLOAD_DIR }}/t3gemstone-toolchains-${DISTRO_BASE}-${DISTRO_SUITE}.tar.gz"
      - |
        if [ ! -d "{{ .TOOLCHAINS_DIR }}" ]; then
          mkdir -p "{{ .TOOLCHAINS_DIR }}"
          tar xf "{{ .DOWNLOAD_DIR }}/t3gemstone-toolchains-${DISTRO_BASE}-${DISTRO_SUITE}.tar.gz" --directory "{{ .TOOLCHAINS_DIR }}"
        fi
      - |
        python3 -m venv "{{ .VENV_DIR }}"
        export PATH="{{ .VENV_DIR }}/bin:$PATH"
        pip3 install --disable-pip-version-check \
          dronecan==1.0.26 \
          empy==3.3.4 \
          future==1.0.0 \
          pexpect==4.9.0 \
          setuptools==80.9.0

  destroy:
    prompt: 'T3 Gemstone Toolchains will be deleted. Do you want to continue?'
    cmds:
      - rm -f "{{ .DOWNLOAD_DIR }}/t3gemstone-toolchains-${DISTRO_BASE}-${DISTRO_SUITE}.tar.gz"
      - rm -rf "{{ .TOOLCHAINS_DIR }}"

  build:
    cmds:
      - task: fetch
      - |
        pushd "{{ .TOOLCHAINS_DIR }}" >/dev/null && source ./env && popd >/dev/null
        export PATH="{{ .VENV_DIR }}/bin:$PATH"
        {{ .WAF }} configure --board="${MACHINE}"
        {{ .WAF }} "${VEHICLE}"
        aarch64-linux-gnu-strip "{{ .BUILD_DIR }}/{{ .MACHINE }}/bin/ardu${VEHICLE}"

  build-deb:
    desc: 'Build t3-gem-ardupilot.deb for all available vehicles'
    silent: true
    vars:
      PKG_NAME: 't3-gem-ardupilot'
      PKG_VERSION: '{{.VERSION | default "1.0.0"}}'
      PKG_ARCH: '{{.DEB_ARCH | default "arm64"}}'
      BUILD_ROOT: '.deb_build/{{.PKG_NAME}}_{{.PKG_VERSION}}'
      VEHICLES: 'plane copter rover sub'
    preconditions:
      - sh: command -v dpkg-deb
        msg: "You must install dpkg-dev: sudo apt install dpkg-dev"
    cmds:
      - |
        for VEHICLE in {{.VEHICLES}}; do
          echo "Building ardu${VEHICLE}..."
          VEHICLE="${VEHICLE}" task build || { echo "Failed to build ${VEHICLE}, skipping"; continue; }
        done
      - |
        PKG_VERSION="{{.PKG_VERSION}}"
        PKG_ARCH="{{.PKG_ARCH}}"
        BUILD_ROOT="{{.BUILD_ROOT}}"
        BOARD_DIR="{{.BOARD_DIR}}"
        VEHICLES="{{.VEHICLES}}"
  
        rm -rf "${BUILD_ROOT}"
        mkdir -p "${BUILD_ROOT}/DEBIAN"
        mkdir -p "${BUILD_ROOT}${BOARD_DIR}/bin"
        mkdir -p "${BUILD_ROOT}${BOARD_DIR}/var"
        mkdir -p "${BUILD_ROOT}/lib/systemd/system"
        mkdir -p "${BUILD_ROOT}/usr/bin"
  
        FOUND=""
        for VEHICLE in ${VEHICLES}; do
          BIN="build/{{.MACHINE}}/bin/ardu${VEHICLE}"
          if [ -f "${BIN}" ]; then
            install -m 755 "${BIN}" "${BUILD_ROOT}${BOARD_DIR}/bin/ardu${VEHICLE}"
            FOUND="${FOUND} ${VEHICLE}"
          fi
        done
  
        if [ -z "${FOUND}" ]; then
          echo "Error: no vehicle binaries found in build/{{.MACHINE}}/bin/"
          exit 1
        fi
  
        echo "Packaging vehicles:${FOUND}"
  
        [ -d gemstone/etc ]     && cp -r gemstone/etc/.     "${BUILD_ROOT}${BOARD_DIR}/etc/"
        [ -d gemstone/systemd ] && cp    gemstone/systemd/* "${BUILD_ROOT}/lib/systemd/system/"
  
        cat > "${BUILD_ROOT}/usr/bin/ardupilot-enable" << SCRIPT
        #!/bin/bash
        AVAILABLE="${FOUND}"
        VEHICLE="\$1"
  
        if [ -z "\${VEHICLE}" ]; then
          echo "Usage: ardupilot-enable <vehicle>"
          echo "Available vehicles: \${AVAILABLE}"
          exit 1
        fi
  
        if ! echo "\${AVAILABLE}" | grep -qw "\${VEHICLE}"; then
          echo "Error: '\${VEHICLE}' is not available. Choose from:\${AVAILABLE}"
          exit 1
        fi
  
        for V in \${AVAILABLE}; do
          if [ "\${V}" != "\${VEHICLE}" ]; then
            sudo systemctl disable --now "ardu\${V}" 2>/dev/null || true
          fi
        done
  
        sudo systemctl enable --now "ardu\${VEHICLE}"
        echo "ArduPilot \${VEHICLE} enabled and started."
        SCRIPT
        chmod 755 "${BUILD_ROOT}/usr/bin/ardupilot-enable"
  
        # DEBIAN/control
        cat > "${BUILD_ROOT}/DEBIAN/control" << CTRL
        Package: t3-gem-ardupilot
        Version: ${PKG_VERSION}
        Architecture: ${PKG_ARCH}
        Maintainer: ArduPilot Build System <build@ardupilot.org>
        Description: ArduPilot autopilot suite for T3 Gemstone board
         Installs all available vehicle binaries. Use ardupilot-enable
         to activate the vehicle of your choice:
         .
           ardupilot-enable plane
           ardupilot-enable copter
         .
         Available vehicles:${FOUND}
        Section: misc
        Priority: optional
        Depends: libc6
        CTRL
        sed -i 's/^      //' "${BUILD_ROOT}/DEBIAN/control"
  
        cat > "${BUILD_ROOT}/DEBIAN/postinst" << 'EOF'
        #!/bin/bash
        set -e
        OVERLAYS="k3-am67a-t3-gem-o1-spidev0-1cs.dtbo k3-am67a-t3-gem-o1-i2c1-400000.dtbo k3-am67a-t3-gem-o1-uart-ttys0.dtbo k3-am67a-t3-gem-o1-uart-ttys6.dtbo k3-am67a-t3-gem-o1-pwm-ecap0-gpio12.dtbo k3-am67a-t3-gem-o1-pwm-ecap1-gpio16.dtbo k3-am67a-t3-gem-o1-pwm-ecap2-gpio18.dtbo k3-am67a-t3-gem-o1-pwm-epwm0-gpio5-gpio14.dtbo k3-am67a-t3-gem-o1-pwm-epwm1-gpio6-gpio13.dtbo"
        UENV="/boot/uEnv.txt"
        if [ -f "${UENV}" ]; then
          if grep -q '^overlays=' "${UENV}"; then
            sed -i "s|^overlays=.*$|overlays=${OVERLAYS}|" "${UENV}"
          else
            echo "overlays=${OVERLAYS}" >> "${UENV}"
          fi
        fi
        systemctl daemon-reload
        echo ""
        echo "ArduPilot installed. Enable your vehicle then reboot:"
        echo "  ardupilot-enable plane"
        echo "  ardupilot-enable copter"
        echo ""
        exit 0
        EOF
        sed -i 's/^      //' "${BUILD_ROOT}/DEBIAN/postinst"
        chmod 755 "${BUILD_ROOT}/DEBIAN/postinst"
  
        cat > "${BUILD_ROOT}/DEBIAN/prerm" << EOF
        #!/bin/bash
        set -e
        for VEHICLE in ${FOUND}; do
          systemctl stop    "ardu\${VEHICLE}" 2>/dev/null || true
          systemctl disable "ardu\${VEHICLE}" 2>/dev/null || true
        done
        exit 0
        EOF
        sed -i 's/^      //' "${BUILD_ROOT}/DEBIAN/prerm"
        chmod 755 "${BUILD_ROOT}/DEBIAN/prerm"
  
        DEB_FILE="{{.PKG_NAME}}_${PKG_VERSION}_${PKG_ARCH}.deb"
        dpkg-deb --build --root-owner-group "${BUILD_ROOT}" "${DEB_FILE}"
  
        echo ""
        echo "Package ready: ${DEB_FILE}"
        echo "Vehicles included:${FOUND}"

  board-setup:
    desc: 'Prepare T3 Gemstone board for running ArduPilot'
    silent: true
    cmds:
      - |
        echo -n "${BOARD_USER}@${BOARD_IP}'s password: "
        read -s BOARD_PASS
        echo
        export SSHPASS="${BOARD_PASS}"

        rsync -av --mkpath --checksum -e "sshpass -e ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" \
          "build/${MACHINE}/bin" gemstone/* "$BOARD_USER@$BOARD_IP:/tmp/ardupilot"

        sshpass -e ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" "${BOARD_USER}@${BOARD_IP}" "
          echo ${BOARD_PASS} | sudo -S -p '' install -d ${BOARD_DIR}/bin ${BOARD_DIR}/etc ${BOARD_DIR}/var
          echo ${BOARD_PASS} | sudo -S -p '' cp -r /tmp/ardupilot/etc /tmp/ardupilot/bin ${BOARD_DIR}
          echo ${BOARD_PASS} | sudo -S -p '' cp /tmp/ardupilot/systemd/* /etc/systemd/system
          echo ${BOARD_PASS} | sudo -S -p '' systemctl daemon-reload
          echo ${BOARD_PASS} | sudo -S -p '' systemctl enable ardu${VEHICLE}
          echo ${BOARD_PASS} | sudo -S -p '' sed -i 's/^overlays=.*$/overlays=k3-am67a-t3-gem-o1-spidev0-1cs.dtbo k3-am67a-t3-gem-o1-i2c1-400000.dtbo k3-am67a-t3-gem-o1-uart-ttys0.dtbo k3-am67a-t3-gem-o1-uart-ttys6.dtbo k3-am67a-t3-gem-o1-pwm-ecap0-gpio12.dtbo k3-am67a-t3-gem-o1-pwm-ecap1-gpio16.dtbo k3-am67a-t3-gem-o1-pwm-ecap2-gpio18.dtbo k3-am67a-t3-gem-o1-pwm-epwm0-gpio5-gpio14.dtbo k3-am67a-t3-gem-o1-pwm-epwm1-gpio6-gpio13.dtbo/' /boot/uEnv.txt
          sync
        "
        echo
        echo "You must reboot your T3 Gemstone board now!"
    preconditions:
      - sh: test -f "build/${MACHINE}/bin/ardu${VEHICLE}"
        msg: "You must build ArduPilot for your vehicle first: task build"
      - sh: command -v sshpass
        msg: "You must install sshpass"
      - sh: command -v rsync
        msg: "You must install rsync"

  board-upload:
    desc: 'Upload new firmware to T3 Gemstone board'
    silent: true
    cmds:
      - |
        echo -n "${BOARD_USER}@${BOARD_IP}'s password: "
        read -s BOARD_PASS
        echo
        export SSHPASS="${BOARD_PASS}"

        rsync -av --mkpath --checksum -e "sshpass -e ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no" \
          "build/${MACHINE}/bin" "$BOARD_USER@$BOARD_IP:/tmp/ardupilot"

        sshpass -e ssh -o "UserKnownHostsFile=/dev/null" -o "StrictHostKeyChecking=no" "${BOARD_USER}@${BOARD_IP}" "
          echo ${BOARD_PASS} | sudo -S -p '' systemctl stop ardu${VEHICLE}
          echo ${BOARD_PASS} | sudo -S -p '' cp -r /tmp/ardupilot/bin ${BOARD_DIR}
          echo ${BOARD_PASS} | sudo -S -p '' systemctl start ardu${VEHICLE}
        "
    preconditions:
      - sh: test -f "build/${MACHINE}/bin/ardu${VEHICLE}"
        msg: "You must build ArduPilot for your vehicle first: task build"
      - sh: command -v sshpass
        msg: "You must install sshpass"
      - sh: command -v rsync
        msg: "You must install rsync"

  sitl-start:
    cmds:
      - xhost +local:docker
      - docker compose up --detach

  sitl-stop:
    cmds:
      - docker compose kill
      - docker compose down --remove-orphans
      - xhost -local:docker

  swarm-up:
    cmds:
      - xhost +local:docker
      - docker compose -f compose.swarm.yaml up --detach

  swarm-down:
    cmds:
      - docker compose -f compose.swarm.yaml kill
      - docker compose -f compose.swarm.yaml down --remove-orphans
      - xhost -local:docker
      
  swarm-cli:
    cmds:
      - task: fetch
      - |
        export PATH="{{ .VENV_DIR }}/bin:$PATH"
        pip3 install --disable-pip-version-check pymavlink openai paho-mqtt
        python3 gemstone/swarm_cli/cli.py

  swarm-logs:
    cmds:
      - docker compose -f compose.swarm.yaml logs -f

  clean:
    cmds:
      - task: fetch
      - |
        pushd "{{ .TOOLCHAINS_DIR }}" >/dev/null && source ./env && popd >/dev/null
        export PATH="{{ .VENV_DIR }}/bin:$PATH"
        {{ .WAF }} clean
